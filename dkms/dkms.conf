PACKAGE_NAME="aspeed-pci-8250"
PACKAGE_VERSION="2.1"

BUILT_MODULE_NAME[0]="8250_aspeed_pci"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean KVER=${kernelver}"
AUTOINSTALL="yes"

# 6.8 is the oldest kernel the compatibility header has been built against.
BUILD_EXCLUSIVE_KERNEL_MIN="6.8"
# Stop building once the kernel has the driver in-tree.
BUILD_EXCLUSIVE_CONFIG="CONFIG_PCI CONFIG_SERIAL_8250 !CONFIG_SERIAL_8250_ASPEED_PCI"
