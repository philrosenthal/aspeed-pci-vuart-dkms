# Installed by aspeed-pci-vuart-dkms.
#
# ipmi_si's PCI driver binds the ASPEED BMC device (1a03:2402) because of its
# KCS class code, but looks for the KCS registers in the wrong BAR and never
# uses it. While it holds the device, 8250_aspeed_pci cannot bind. KCS is
# still found through ACPI, so ipmitool keeps working.
options ipmi_si trypci=0
