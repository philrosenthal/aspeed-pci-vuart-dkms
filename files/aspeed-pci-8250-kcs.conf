# Installed by aspeed-pci-vuart-dkms (--kcs-fix).
#
# ipmi_si's PCI driver binds the ASPEED BMC device (1a03:2402) because of its
# KCS class code, but looks for the KCS registers in the wrong BAR and never
# uses it. While it holds the device, 8250_aspeed_pci cannot bind.
#
# The KCS address from ACPI is also replaced by BAR1 + 0xe88 of the device,
# computed when ipmi_si loads, because on some firmware the ACPI address is
# the one the BIOS assigned and goes stale when Linux moves the BAR.
install ipmi_si /sbin/modprobe --ignore-install ipmi_si trypci=0 $(/usr/local/sbin/aspeed-bmc-kcs-args 2>/dev/null) $CMDLINE_OPTS
